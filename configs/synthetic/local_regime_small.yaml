run:
  name: synthetic_local_regime_v1_seed0
  output_dir: artifacts/runs
  seed: 0

dataset:
  type: synthetic_local_regime
  num_nodes: 3000
  num_classes: 3
  feature_dim: 32
  num_patches: 12

model:
  hidden_dim: 64
  dropout: 0.3
  gate_hidden_dim: 32

training:
  epochs: 300
  patience: 50
  lr: 0.001
  weight_decay: 0.0005
  lambda_align: 0.05
  lambda_smooth: 0.01

counterfactuals:
  enabled: true
  modes:
    - mean_feature_mask
    - ego_edge_mask
    - attribute_expert_only
    - topology_expert_only

projection:
  method: umap
  fallback: pca
  seed: 0
